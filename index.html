<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Fractal Playground - Hidden Seed</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030407;
            font-family: system-ui, -apple-system, sans-serif;
            color: #e0e6ed;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 250px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
        }

        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ui-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #a0aec0;
        }

        .score-badge {
            background: rgba(168, 85, 247, 0.3);
            border: 1px solid rgba(192, 132, 252, 0.5);
            color: #f3e8ff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        button {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="ui-panel">
        <div class="ui-header">
            <span class="ui-title">Fractal Nexus</span>
            <span class="score-badge" id="seedCount">Found: 0</span>
        </div>

        <div class="btn-row">
            <button id="toggleSound">Sound: ON</button>
            <button id="btnRestart">Restart</button>
        </div>
    </div>

    <div class="hint">Tap to plant. Seek the hidden seeds to unlock and evolve new fractal dimensions...</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let soundEnabled = true;
        let activeBlooms = [];
        let rewardParticles = [];
        let seedsFound = 0;
        let currentFractalType = -1; // -1 means standard organic tree before any seed is collected

        const calmingScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCalmTap() {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const freq = calmingScale[Math.floor(Math.random() * calmingScale.length)];
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.05); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5); 

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } catch(e) {}
        }

        function playRewardCascade() {
            if (!soundEnabled || !audioCtx) return;
            const arpeggio = [0, 2, 4, 6, 7];
            
            arpeggio.forEach((noteIdx, i) => {
                setTimeout(() => {
                    try {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();

                        osc.type = 'triangle'; 
                        osc.frequency.setValueAtTime(calmingScale[noteIdx % calmingScale.length] * 1.5, audioCtx.currentTime);

                        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start();
                        osc.stop(audioCtx.currentTime + 2.5);
                    } catch(e) {}
                }, i * 100);
            });
        }

        class HiddenSeed {
            constructor() {
                this.relocate();
            }
            relocate() {
                const padding = 150;
                this.x = padding + Math.random() * (width - padding * 2);
                this.y = padding + Math.random() * (height - padding * 2);

                if (this.x > width - 300 && this.y < 200) {
                    this.y += 200;
                }
            }
        }

        const hiddenSeed = new HiddenSeed();

        // ---------------------------------------------------------
        // UNIVERSAL FRACTAL GENERATOR
        // Defines the structural "bones" of each distinct fractal
        // ---------------------------------------------------------
        function generateFractalBranch(isReward, type, depth, maxDepth, angle, length) {
            if (depth >= maxDepth) return null;
            let children = [];

            if (type === -1) {
                // STANDARD TAP: Original Organic Tree (Before 1st seed collection)
                const offsetLeft = (20 + Math.random() * 30) * Math.PI / 180;
                const offsetRight = (20 + Math.random() * 30) * Math.PI / 180;
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle - offsetLeft, length * (0.6 + Math.random() * 0.2)));
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle + offsetRight, length * (0.6 + Math.random() * 0.2)));
                if (Math.random() < 0.4 && depth < maxDepth - 1) {
                    children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle + (Math.random() - 0.5) * 0.3, length * 0.5));
                }

            } else if (type === 0) {
                // 1ST SEED: Snowflake / Koch (Strict 60-degree hex geometry)
                const offset = Math.PI / 3; 
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle - offset, length * 0.5));
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle + offset, length * 0.5));
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle, length * 0.6));

            } else if (type === 1) {
                // 2ND SEED: Mandelbrot (Cardioid Bulbs and split stems)
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle + 0.6, length * 0.6));
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle - 0.6, length * 0.6));
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle, length * 0.75));

            } else if (type === 2) {
                // 3RD SEED: Julia (Deep sweeping interlocking spirals)
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle + 0.35, length * 0.85)); 
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle - 0.2, length * 0.7)); 
                
            } else if (type === 3) {
                // 4TH SEED: Burning Ship (Rigid blocks, chaotic 90-degree lines)
                const offset = Math.PI / 2; 
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle - offset, length * 0.55));
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle + offset, length * 0.55));
                children.push(generateFractalBranch(isReward, type, depth + 1, maxDepth, angle, length * 0.7));
            }

            return { depth, angle, targetLength: length, children: children.filter(Boolean) };
        }

        class RadialBloom {
            constructor(x, y, hue, isReward = false, rewardType = 0) {
                this.x = x;
                this.y = y;
                this.baseHue = hue; 
                this.colorCarousel = 0; 
                this.isReward = isReward;
                this.rewardType = rewardType;
                this.rotation = Math.random() * Math.PI * 2;
                this.life = 1.0;
                this.currentGrowth = 0.1; 
                this.growthSpeed = 0.04; 

                if (isReward) {
                    // Reward / Seed reveal configuration
                    this.decay = 0.005;
                    
                    if (rewardType === 0) {
                        this.maxDepth = 5; this.symmetries = 6; this.baseLength = 80;
                        this.spinSpeed = 0.003;
                    } else if (rewardType === 1) {
                        this.maxDepth = 6; this.symmetries = 1; this.baseLength = 120;
                        this.rotation = -Math.PI / 2; 
                        this.spinSpeed = 0; 
                    } else if (rewardType === 2) {
                        this.maxDepth = 8; this.symmetries = 4; this.baseLength = 60;
                        this.spinSpeed = 0.01; 
                    } else if (rewardType === 3) {
                        this.maxDepth = 6; this.symmetries = 2; this.baseLength = 90;
                        this.rotation = 0; 
                        this.spinSpeed = 0; 
                    }
                } else {
                    // Standard Tap configuration governed by current unlocked seed style
                    this.decay = 0.015;

                    if (rewardType === -1) {
                        this.maxDepth = 2 + Math.floor(Math.random() * 2);
                        this.symmetries = 3 + Math.floor(Math.random() * 4);
                        this.baseLength = 30 + Math.random() * 25;
                        this.spinSpeed = (Math.random() - 0.5) * 0.01;
                    } else if (rewardType === 0) {
                        this.maxDepth = 4; this.symmetries = 6; this.baseLength = 50;
                        this.spinSpeed = 0.002;
                    } else if (rewardType === 1) {
                        this.maxDepth = 5; this.symmetries = 1; this.baseLength = 70;
                        this.rotation = -Math.PI / 2; this.spinSpeed = 0;
                    } else if (rewardType === 2) {
                        this.maxDepth = 5; this.symmetries = 4; this.baseLength = 45;
                        this.spinSpeed = 0.005;
                    } else if (rewardType === 3) {
                        this.maxDepth = 5; this.symmetries = 2; this.baseLength = 60;
                        this.rotation = 0; this.spinSpeed = 0;
                    }
                }

                this.treeSymmetries = [];
                this.generateStructure();
            }

            generateStructure() {
                this.treeSymmetries = [];
                for (let i = 0; i < this.symmetries; i++) {
                    const startAngle = this.rotation + (i * Math.PI * 2) / this.symmetries;
                    const rootBranch = generateFractalBranch(this.isReward, this.rewardType, 0, this.maxDepth, startAngle, this.baseLength);
                    this.treeSymmetries.push(rootBranch);
                }
            }

            grow() {
                if (this.maxDepth < 6) {
                    this.maxDepth += 1;
                    this.baseLength += 10;
                    this.life = 1.0; 
                    this.spinSpeed += (Math.random() - 0.5) * 0.02;
                    this.generateStructure();
                }
            }

            update() {
                if (this.currentGrowth < this.maxDepth) {
                    this.currentGrowth += this.growthSpeed;
                }
                this.life -= this.decay;
                this.rotation += this.spinSpeed;
                
                if (this.isReward || this.rewardType !== -1) {
                    this.colorCarousel += 2; 
                } else {
                    this.spinSpeed *= 0.98; 
                }
                return this.life > 0;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.globalCompositeOperation = 'lighter';
                
                for (let i = 0; i < this.treeSymmetries.length; i++) {
                    const rootBranch = this.treeSymmetries[i];
                    if (rootBranch) {
                        this.drawBranchNode(ctx, this.x, this.y, rootBranch, 0, i);
                    }
                }
                ctx.restore();
            }

            // ---------------------------------------------------------
            // RENDER LOGIC: Translates math nodes into distinct aesthetics
            // ---------------------------------------------------------
            drawBranchNode(ctx, x, y, node, currentDepth, symIndex) {
                if (currentDepth > this.currentGrowth) return;

                const depthFraction = Math.min(1, Math.max(0, this.currentGrowth - currentDepth));
                const length = node.targetLength * depthFraction;

                const branchAngle = node.angle + this.rotation; 
                const x2 = x + length * Math.cos(branchAngle);
                const y2 = y + length * Math.sin(branchAngle);

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x2, y2);

                if (this.rewardType === -1) {
                    // Standard Organic Tree Rendering (Pre-first seed)
                    ctx.strokeStyle = `hsl(${this.baseHue}, 80%, ${70 - currentDepth * 8}%)`;
                    ctx.lineWidth = Math.max(0.5, (this.maxDepth - currentDepth) * 1.2);
                    ctx.lineCap = 'round';
                    ctx.stroke();
                } else {
                    if (this.rewardType === 0) {
                        // SEED 1: Snowflake (Sharp Ice)
                        const hue = 190 + (this.colorCarousel * 0.2) % 40; 
                        ctx.strokeStyle = `hsl(${hue}, 100%, ${60 + currentDepth*5}%)`;
                        ctx.lineWidth = Math.max(1, (this.maxDepth - currentDepth) * 1.2);
                        ctx.lineCap = 'butt'; 
                        ctx.stroke();

                        if (currentDepth === this.maxDepth - 1) {
                            ctx.fillStyle = `hsl(${hue}, 100%, 90%)`;
                            ctx.fillRect(x2 - 1.5, y2 - 1.5, 3, 3); // Ice diamond tips
                        }

                    } else if (this.rewardType === 1) {
                        // SEED 2: Mandelbrot (Deep purple bulbs & bubbles)
                        const hue = (280 + currentDepth * 15) % 360; 
                        ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
                        ctx.lineWidth = Math.max(1, (this.maxDepth - currentDepth));
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(x2, y2, Math.max(1, (this.maxDepth - currentDepth) * 1.8), 0, Math.PI * 2);
                        ctx.fillStyle = `hsl(${hue}, 100%, 75%)`;
                        ctx.fill();

                    } else if (this.rewardType === 2) {
                        // SEED 3: Julia Set (Golden/Cyan swooping galaxy arms)
                        const hue = (45 + this.colorCarousel * 0.5 + currentDepth * 10) % 360; 
                        ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
                        ctx.lineWidth = Math.max(1, (this.maxDepth - currentDepth) * 1.5);
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        if (depthFraction > 0.8) {
                            ctx.beginPath();
                            ctx.arc(x2, y2, 1.5, 0, Math.PI * 2);
                            ctx.fillStyle = `hsl(${hue}, 100%, 85%)`;
                            ctx.fill();
                        }

                    } else if (this.rewardType === 3) {
                        // SEED 4: Burning Ship (Grid-like artifacts & Fire spikes)
                        const hue = (0 + currentDepth * 12) % 60; 
                        ctx.strokeStyle = `hsl(${hue}, 100%, 55%)`;
                        ctx.lineWidth = Math.max(1, (this.maxDepth - currentDepth) * 1.5);
                        ctx.lineCap = 'square';
                        ctx.stroke();

                        if (currentDepth > 1 && Math.random() < 0.4) {
                            ctx.beginPath();
                            ctx.moveTo(x2, y2);
                            ctx.lineTo(x2, y2 - (10 + Math.random() * 20) * depthFraction); 
                            ctx.strokeStyle = `rgba(255, ${Math.random()*150 + 50}, 0, 0.8)`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                // Recurse to children
                if (depthFraction >= 0.7 && node.children) {
                    for (let child of node.children) {
                        this.drawBranchNode(ctx, x2, y2, child, currentDepth + 1, symIndex);
                    }
                }
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = 0.01 + Math.random() * 0.015;
                this.hue = (hue + (Math.random() - 0.5) * 60) % 360;
                this.size = 2 + Math.random() * 4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.life -= this.decay;
                return this.life > 0;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = `hsl(${this.hue}, 100%, 75%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function triggerBloom(x, y) {
            initAudio();

            const distToSeed = Math.hypot(hiddenSeed.x - x, hiddenSeed.y - y);
            const randomHue = Math.floor(Math.random() * 360); 

            // Check if user hit the invisible seed
            if (distToSeed < 100) {
                let currentRewardIndex = seedsFound % 4; // Cycles through 0, 1, 2, 3
                
                seedsFound++;
                document.getElementById('seedCount').textContent = `Found: ${seedsFound}`;

                // Update the tapped fractal pattern to match the newly unlocked seed/level style!
                currentFractalType = currentRewardIndex;

                // Spawn the specific algorithm reward bloom
                activeBlooms.push(new RadialBloom(hiddenSeed.x, hiddenSeed.y, randomHue, true, currentRewardIndex));
                
                let particleHue = randomHue;
                if (currentRewardIndex === 0) particleHue = 190; // Snowflake: Ice Blue
                if (currentRewardIndex === 1) particleHue = 300; // Mandelbrot: Purple/Pink
                if (currentRewardIndex === 2) particleHue = 45;  // Julia: Gold
                if (currentRewardIndex === 3) particleHue = 15;  // Burning Ship: Orange/Red

                for (let i = 0; i < 80; i++) {
                    rewardParticles.push(new Particle(hiddenSeed.x, hiddenSeed.y, particleHue));
                }

                playRewardCascade();
                hiddenSeed.relocate();
                return;
            }

            // Normal Tap (now uses currentFractalType pattern)
            let nearby = activeBlooms.find(b => !b.isReward && Math.hypot(b.x - x, b.y - y) < 80);

            if (nearby) {
                nearby.grow();
                playCalmTap();
            } else {
                activeBlooms.push(new RadialBloom(x, y, randomHue, false, currentFractalType));
                playCalmTap();
            }

            if (activeBlooms.length > 15) {
                activeBlooms.shift();
            }
        }

        function restartApp() {
            activeBlooms = [];
            rewardParticles = [];
            seedsFound = 0;
            currentFractalType = -1;
            document.getElementById('seedCount').textContent = `Found: 0`;
            ctx.clearRect(0, 0, width, height);
            hiddenSeed.relocate();
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        canvas.addEventListener('pointerdown', (e) => {
            triggerBloom(e.clientX, e.clientY);
        });

        document.getElementById('toggleSound').addEventListener('click', (e) => {
            soundEnabled = !soundEnabled;
            e.target.textContent = `Sound: ${soundEnabled ? 'ON' : 'OFF'}`;
        });

        document.getElementById('btnRestart').addEventListener('click', () => {
            restartApp();
        });

        function animate() {
            ctx.fillStyle = 'rgba(3, 4, 7, 0.25)';
            ctx.fillRect(0, 0, width, height);

            rewardParticles = rewardParticles.filter(p => {
                const alive = p.update();
                if (alive) p.draw(ctx);
                return alive;
            });

            activeBlooms = activeBlooms.filter(bloom => {
                const alive = bloom.update();
                if (alive) bloom.draw(ctx);
                return alive;
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
