<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLOOM by SRG774</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030407;
            font-family: system-ui, -apple-system, sans-serif;
            color: #e0e6ed;
            position: fixed;
            touch-action: none;
            overscroll-behavior: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            touch-action: none;
        }

        #interaction-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 4, 7, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            transition: opacity 0.5s ease;
        }

        .overlay-content {
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .overlay-title {
            font-size: 32px;
            font-weight: 700;
            color: #00ffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .overlay-desc {
            font-size: 14px;
            color: #a0aec0;
            line-height: 1.6;
        }

        #start-btn {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2), rgba(0, 200, 255, 0.4));
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #fff;
            padding: 14px 36px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 255, 255, 0.1);
            transition: all 0.3s ease;
            margin-top: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 255, 255, 0.25);
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.3), rgba(0, 200, 255, 0.6));
        }

        #play-content { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
        }

        #orientation-mask {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            z-index: 9999;
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .phone-icon {
            width: 50px;
            height: 80px;
            border: 3px solid white;
            border-radius: 10px;
            margin-bottom: 20px;
            animation: rotatePhone 2s ease-in-out infinite;
            position: relative;
        }

        .phone-icon::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: white;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        @media screen and (max-aspect-ratio: 13/16) and (max-width: 767px) {
            #orientation-mask {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="orientation-mask">
        <div class="phone-icon"></div>
        <h2>Please Rotate Your Device</h2>
        <p>This game is best played in Landscape Mode.</p>
    </div>

    <div id="interaction-overlay">
        <div class="overlay-content">
            <div id="play-content">
                <div class="overlay-title">BLOOM</div>
                <div class="overlay-desc" style="font-weight: bold; color: #fff; font-size: 16px;">by SRG774</div>
                <div class="overlay-desc">Tap to plant. Find the hidden seeds to unlock screen-filling dimensional shifts. All UI is hidden for immersion.</div>
                <button id="start-btn">Enter & Play</button>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        let width, height;
        resizeCanvas();

        let activeBlooms = [];
        let seedsFound = 0;
        let currentFractalType = -1;
        let isAnimatingWin = false;

        const ambientScale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63];
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCalmTap() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                
                const freq = ambientScale[Math.floor(Math.random() * ambientScale.length)];
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);

                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.02, audioCtx.currentTime + 0.1); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0); 

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 2.0);
            } catch(e) {}
        }

        function playMegaDrone() {
            if (!audioCtx) return;
            try {
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc1.type = 'sine';
                osc2.type = 'triangle';
                osc1.frequency.setValueAtTime(130.81, audioCtx.currentTime);
                osc2.frequency.setValueAtTime(132.00, audioCtx.currentTime);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(100, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 3.5);
                filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 7.0);

                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 2.0);
                gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 5.0);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 7.0);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start();
                osc2.start();
                osc1.stop(audioCtx.currentTime + 7.5);
                osc2.stop(audioCtx.currentTime + 7.5);
            } catch(e) {}
        }

        class HiddenSeed {
            constructor() {
                this.relocate();
            }
            relocate() {
                const padding = 100;
                this.x = padding + Math.random() * (width - padding * 2);
                this.y = padding + Math.random() * (height - padding * 2);
            }
        }

        const hiddenSeed = new HiddenSeed();

        function generateFractalBranch(type, depth, maxDepth, angle, length) {
            if (depth >= maxDepth) return null;
            let children = [];

            if (type === -1) {
                const offsetLeft = (20 + Math.random() * 30) * Math.PI / 180;
                const offsetRight = (20 + Math.random() * 30) * Math.PI / 180;
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle - offsetLeft, length * (0.6 + Math.random() * 0.2)));
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle + offsetRight, length * (0.6 + Math.random() * 0.2)));
                if (Math.random() < 0.4 && depth < maxDepth - 1) {
                    children.push(generateFractalBranch(type, depth + 1, maxDepth, angle + (Math.random() - 0.5) * 0.3, length * 0.5));
                }
            } else if (type === 0) {
                const offset = Math.PI / 4; 
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle - offset, length * 0.78));
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle + offset, length * 0.78));
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle, length * 0.82));
            } else if (type === 1) {
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle + 0.4, length * 0.8));
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle - 0.4, length * 0.8));
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle, length * 0.85));
            } else if (type === 2) {
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle + 0.3, length * 0.82)); 
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle - 0.3, length * 0.82)); 
            } else if (type === 3) {
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle + 0.25, length * 0.8));
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle - 0.25, length * 0.8));
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle + 0.6, length * 0.5));
                children.push(generateFractalBranch(type, depth + 1, maxDepth, angle - 0.6, length * 0.5));
            }

            return { depth, angle, targetLength: length, children: children.filter(Boolean) };
        }

        class RadialBloom {
            constructor(x, y, hue, rewardType = 0, isMega = false) {
                this.x = x;
                this.y = y;
                this.baseHue = hue; 
                this.colorCarousel = 0; 
                this.rewardType = rewardType;
                this.rotation = Math.random() * Math.PI * 2;
                this.currentGrowth = 0.0; 
                this.isMega = isMega;

                if (this.isMega) {
                    this.startTime = performance.now();
                    this.duration = 7000; 
                    this.baseLength = 80; // Compact center so inner branches bloom outwards
                    this.spinSpeed = 0.0012; 
                    this.maxDepth = 6;
                    
                    // High rotational symmetry prevents the harsh 4-spoke cross pattern
                    if (rewardType === 0) { this.symmetries = 12; }
                    else if (rewardType === 1) { this.symmetries = 10; }
                    else if (rewardType === 2) { this.symmetries = 8; }
                    else if (rewardType === 3) { this.symmetries = 12; }
                } else {
                    this.life = 1.0;
                    this.decay = 0.006;
                    this.growthSpeed = 0.04;

                    if (rewardType === -1) {
                        this.maxDepth = 2 + Math.floor(Math.random() * 2);
                        this.symmetries = 3 + Math.floor(Math.random() * 4);
                        this.baseLength = 25 + Math.random() * 20;
                        this.spinSpeed = (Math.random() - 0.5) * 0.01;
                    } else if (rewardType === 0) {
                        this.maxDepth = 4; this.symmetries = 6; this.baseLength = 45;
                        this.spinSpeed = 0.002;
                    } else if (rewardType === 1) {
                        this.maxDepth = 5; this.symmetries = 1; this.baseLength = 60;
                        this.rotation = -Math.PI / 2; this.spinSpeed = 0;
                    } else if (rewardType === 2) {
                        this.maxDepth = 5; this.symmetries = 6; this.baseLength = 40;
                        this.spinSpeed = 0.005;
                    } else if (rewardType === 3) {
                        this.maxDepth = 4; this.symmetries = 2; this.baseLength = 50;
                        this.rotation = -Math.PI / 2; this.spinSpeed = 0;
                    }
                }

                this.treeSymmetries = [];
                this.generateStructure();
            }

            generateStructure() {
                this.treeSymmetries = [];
                for (let i = 0; i < this.symmetries; i++) {
                    const startAngle = this.rotation + (i * Math.PI * 2) / this.symmetries;
                    const rootBranch = generateFractalBranch(this.rewardType, 0, this.maxDepth, startAngle, this.baseLength);
                    this.treeSymmetries.push(rootBranch);
                }
            }

            grow() {
                if (!this.isMega && this.maxDepth < 6) {
                    this.maxDepth += 1;
                    this.baseLength += 8;
                    this.life = 1.0; 
                    this.spinSpeed += (Math.random() - 0.5) * 0.02;
                    this.generateStructure();
                }
            }

            update() {
                if (this.isMega) {
                    const elapsed = performance.now() - this.startTime;
                    
                    // Unfold layer-by-layer from depth 0 up to maxDepth over 4 seconds
                    const growthProgress = Math.min(1, elapsed / 4000);
                    this.currentGrowth = (1 - Math.pow(1 - growthProgress, 2.5)) * this.maxDepth;

                    this.rotation += this.spinSpeed;
                    this.colorCarousel += 2;

                    if (elapsed > this.duration) {
                        isAnimatingWin = false;
                        hiddenSeed.relocate();
                        return false; 
                    }
                    return true;
                } else {
                    if (this.currentGrowth < this.maxDepth) {
                        this.currentGrowth += this.growthSpeed;
                    }
                    this.life -= this.decay;
                    this.rotation += this.spinSpeed;
                    
                    if (this.rewardType !== -1) {
                        this.colorCarousel += 2; 
                    } else {
                        this.spinSpeed *= 0.98; 
                    }
                    return this.life > 0;
                }
            }

            draw(ctx) {
                let alpha = 1.0;
                if (this.isMega) {
                    const elapsed = performance.now() - this.startTime;
                    if (elapsed > 6000) {
                        alpha = Math.max(0, 1.0 - ((elapsed - 6000) / 1000));
                    }
                } else {
                    alpha = Math.max(0, this.life);
                }

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.globalCompositeOperation = 'lighter';
                
                for (let i = 0; i < this.treeSymmetries.length; i++) {
                    const rootBranch = this.treeSymmetries[i];
                    if (rootBranch) {
                        this.drawBranchNode(ctx, this.x, this.y, rootBranch, 0, i);
                    }
                }
                ctx.restore();
            }

            drawBranchNode(ctx, x, y, node, currentDepth, symIndex) {
                if (currentDepth > this.currentGrowth) return;

                const depthFraction = Math.min(1, Math.max(0, this.currentGrowth - currentDepth));
                const length = node.targetLength * depthFraction;

                const branchAngle = node.angle + this.rotation; 
                const x2 = x + length * Math.cos(branchAngle);
                const y2 = y + length * Math.sin(branchAngle);

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x2, y2);

                if (this.rewardType === -1) {
                    ctx.strokeStyle = `hsl(${this.baseHue}, 80%, ${70 - currentDepth * 8}%)`;
                    ctx.lineWidth = Math.max(0.5, (this.maxDepth - currentDepth) * 1.2);
                    ctx.lineCap = 'round';
                    ctx.stroke();
                } else {
                    const strokeMultiplier = this.isMega ? 1.8 : 1.2;

                    if (this.rewardType === 0) {
                        const hue = 190 + (this.colorCarousel * 0.2 + currentDepth * 12) % 60; 
                        ctx.strokeStyle = `hsl(${hue}, 100%, ${60 + currentDepth * 5}%)`;
                        ctx.lineWidth = Math.max(0.8, (this.maxDepth - currentDepth) * strokeMultiplier);
                        ctx.lineCap = 'round'; 
                        ctx.stroke();

                        if (currentDepth === Math.floor(this.currentGrowth)) {
                            ctx.fillStyle = `hsl(${hue}, 100%, 90%)`;
                            ctx.fillRect(x2 - 2, y2 - 2, 4, 4);
                        }
                    } else if (this.rewardType === 1) {
                        const hue = (280 + currentDepth * 15 + this.colorCarousel * 0.3) % 360; 
                        ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
                        ctx.lineWidth = Math.max(0.8, (this.maxDepth - currentDepth) * strokeMultiplier);
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(x2, y2, Math.max(1, (this.maxDepth - currentDepth) * 1.5), 0, Math.PI * 2);
                        ctx.fillStyle = `hsl(${hue}, 100%, 75%)`;
                        ctx.fill();
                    } else if (this.rewardType === 2) {
                        const hue = (45 + this.colorCarousel * 0.5 + currentDepth * 10) % 360; 
                        ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
                        ctx.lineWidth = Math.max(0.8, (this.maxDepth - currentDepth) * strokeMultiplier);
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        if (depthFraction > 0.8) {
                            ctx.beginPath();
                            ctx.arc(x2, y2, 2, 0, Math.PI * 2);
                            ctx.fillStyle = `hsl(${hue}, 100%, 85%)`;
                            ctx.fill();
                        }
                    } else if (this.rewardType === 3) {
                        const hue = (320 + currentDepth * 15 + this.colorCarousel * 0.5) % 360;
                        ctx.strokeStyle = `hsl(${hue}, 80%, ${60 + currentDepth * 5}%)`;
                        ctx.lineWidth = Math.max(0.8, (this.maxDepth - currentDepth) * strokeMultiplier);
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        if (currentDepth > 2) {
                            ctx.beginPath();
                            ctx.arc(x2, y2, 2, 0, Math.PI * 2);
                            ctx.fillStyle = `hsl(${hue}, 100%, 85%)`;
                            ctx.fill();
                        }
                    }
                }

                if (depthFraction >= 0.6 && node.children) {
                    for (let child of node.children) {
                        this.drawBranchNode(ctx, x2, y2, child, currentDepth + 1, symIndex);
                    }
                }
            }
        }

        function triggerBloom(x, y) {
            initAudio();

            const distToSeed = Math.hypot(hiddenSeed.x - x, hiddenSeed.y - y);
            const randomHue = Math.floor(Math.random() * 360); 

            if (distToSeed < 35) {
                isAnimatingWin = true; 
                activeBlooms = []; 
                
                let currentRewardIndex = seedsFound % 4; 
                seedsFound++;
                currentFractalType = currentRewardIndex;

                activeBlooms.push(new RadialBloom(width / 2, height / 2, randomHue, currentRewardIndex, true));
                
                playMegaDrone();
                return;
            }

            let nearby = activeBlooms.find(b => !b.isMega && Math.hypot(b.x - x, b.y - y) < 80);

            if (nearby) {
                nearby.grow();
                playCalmTap();
            } else {
                activeBlooms.push(new RadialBloom(x, y, randomHue, currentFractalType, false));
                playCalmTap();
            }

            if (activeBlooms.length > 30) {
                activeBlooms.shift();
            }
        }

        window.addEventListener('resize', resizeCanvas);

        const handleInteraction = (e) => {
            e.preventDefault(); 
            
            if (isAnimatingWin) return;

            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX - rect.left;
                clientY = e.touches[0].clientY - rect.top;
            } else {
                clientX = e.clientX - rect.left;
                clientY = e.clientY - rect.top;
            }

            triggerBloom(clientX, clientY);
        };

        canvas.addEventListener('touchstart', handleInteraction, { passive: false });
        canvas.addEventListener('mousedown', handleInteraction);

        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio();
            
            const docElement = document.documentElement;
            if (docElement.requestFullscreen) {
                docElement.requestFullscreen().catch(err => {});
            } else if (docElement.webkitRequestFullscreen) {
                docElement.webkitRequestFullscreen();
            }

            const overlay = document.getElementById('interaction-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);
        });

        function animate() {
            ctx.fillStyle = 'rgba(3, 4, 7, 0.15)';
            ctx.fillRect(0, 0, width, height);

            activeBlooms = activeBlooms.filter(bloom => {
                const alive = bloom.update();
                if (alive) bloom.draw(ctx);
                return alive;
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
